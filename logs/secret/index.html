<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LOGS SECRET</title>
<style>
body {
  margin: 0;
  background: black;
  color: #0a0;
  font-family: monospace;
  text-align: center;
  padding-top: 15vh;
  overflow: hidden;
}

h1 {
  font-size: 2em;
  animation: flicker 0.15s infinite;
}

@keyframes flicker {
  0%, 49%, 100% { opacity: 1; }
  25%, 75% { opacity: 0.5; }
}

/* Hidden texts */
.hidden {
  opacity: 0.02;
  position: absolute;
  font-size: 0.9em;
}

.subtle {
  opacity: 0.03;
  position: absolute;
  font-size: 0.9em;
}

/* Background noise container */
.bg-noise {
  position: fixed;
  top: 0;
  left: 0;
  font-size: 6px;
  opacity: 0.02;
  pointer-events: none;
  width: 100%;
  height: 100%;
  line-height: 6px;
  z-index: 2;
  overflow: hidden;
}

/* Noise letters over QR code */
.qr-noise-layer {
  position: absolute;
  top: 35%;
  left: 55%;
  width: 120px;
  height: 120px;
  font-size: 6px;
  line-height: 6px;
  color: #0a0;
  opacity: 0.02;
  z-index: 3; /* above QR */
  pointer-events: none;
  white-space: pre;
  animation: glitchLetters 0.15s infinite;
}

/* QR Code with glitch effect */
.qr-glitch {
  position: absolute;
  top: 40%;
  left: 60%;
  width: 100px;
  opacity: 0.015;
  z-index: 1; /* behind letters */
  animation: qrFlicker 0.8s infinite alternate, qrScale 1.2s infinite alternate, qrGlitch 0.3s infinite;
  transform-origin: center;
}

@keyframes qrFlicker {
  0% { opacity: 0.005; }
  50% { opacity: 0.02; }
  100% { opacity: 0.005; }
}

@keyframes qrScale {
  0% { transform: scale(0.98); }
  50% { transform: scale(1.02); }
  100% { transform: scale(0.98); }
}

@keyframes qrGlitch {
  0% { transform: translate(0px, 0px) scale(1); }
  20% { transform: translate(-1px, 1px) scale(1); }
  40% { transform: translate(1px, -1px) scale(1); }
  60% { transform: translate(-1px, 0px) scale(1); }
  80% { transform: translate(1px, 1px) scale(1); }
  100% { transform: translate(0px, 0px) scale(1); }
}

/* Letters flicker animation */
@keyframes glitchLetters {
  0% { transform: translate(0px, 0px); }
  20% { transform: translate(-1px, 1px); }
  40% { transform: translate(1px, -1px); }
  60% { transform: translate(-1px, 0px); }
  80% { transform: translate(1px, 1px); }
  100% { transform: translate(0px, 0px); }
}

/* Start button styling */
#startButton {
  margin-top: 20px;
  padding: 12px 24px;
  font-size: 1em;
  cursor: pointer;
  background: black;
  color: #0a0;
  border: 1px solid #0a0;
  transition: 0.3s;
}

#startButton:hover {
  background: #0a0;
  color: black;
}
</style>

<script>
// Background audio function
function startAudio() {
  const audio1 = new Audio('audio1.mp3');
  audio1.loop = true;
  audio1.volume = 0.3;
  audio1.play();

  const audio2 = new Audio('audio2.mp3');
  audio2.volume = 0.3;

  function loopWithDelay() {
    audio2.play();
    audio2.onended = () => setTimeout(loopWithDelay, 10000);
  }

  loopWithDelay();
}

// Reveal page content and start audio
function activateArchive() {
  document.getElementById('startButton').style.display = 'none';
  document.getElementById('logsContent').style.display = 'block';
  startAudio();
}

// Generate random letters for QR overlay
function generateNoise() {
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const size = 120 * 20; // width*height / approximate number of characters
  let text = "";
  for (let i = 0; i < size; i++) {
    text += letters.charAt(Math.floor(Math.random() * letters.length));
    if (i % 20 === 0) text += "\n";
  }
  document.getElementById("qrNoise").textContent = text;
  setTimeout(generateNoise, 100); // constantly update letters
}

window.onload = function() {
  generateNoise();
}
</script>
</head>

<body>

<h1>SECRET ARCHIVE</h1>
<p>The signal fractures here...</p>

<button id="startButton" onclick="activateArchive()">Click to Activate Archive</button>

<div id="logsContent" style="display:none">

  <!-- Hidden clues -->
  <p class="hidden">VIZION MOVES SILENTLY</p>
  <p class="hidden" style="bottom:50px; left:30%;">LOOK FOR THE MASK</p>
  <p class="hidden" style="top:20%; left:10%;">.esac eht peek ot uoy era</p>

  <!-- ARG comments -->
  <!-- THE MASK IS HERE -->
  <!-- TRACE THE LIGHT SHADOWS -->
  <!-- 546865206b65792069732068657265 -->

  <!-- Background noise -->
  <div class="bg-noise">
    OBSERVED VISION SIGNAL FRACTURE TRACE SHADOW OBSERVED VISION
    OBSERVED VISION SIGNAL FRACTURE TRACE SHADOW OBSERVED VISION
  </div>

  <!-- Glitchy QR code -->
  <img src="qrcode.png" class="qr-glitch" alt="Hidden QR Code">

  <!-- Letters overlay to partially mask QR code -->
  <pre id="qrNoise" class="qr-noise-layer"></pre>

</div>

</body>
</html>
