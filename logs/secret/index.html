<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LOGS SECRET</title>
<style>
body {
  margin: 0;
  background: black;
  color: #0a0;
  font-family: monospace;
  text-align: center;
  padding-top: 15vh;
  overflow: hidden;
}

h1 {
  font-size: 2em;
  animation: flicker 0.15s infinite;
}

@keyframes flicker {
  0%, 49%, 100% { opacity: 1; }
  25%, 75% { opacity: 0.5; }
}

.hidden {
  opacity: 0.02;
  position: absolute;
  font-size: 0.9em;
}

.subtle {
  opacity: 0.03;
  position: absolute;
  font-size: 0.9em;
}

.bg-noise {
  position: fixed;
  top: 0;
  left: 0;
  font-size: 6px;
  opacity: 0.02;
  pointer-events: none;
  width: 100%;
  height: 100%;
  line-height: 6px;
  z-index: 2;
}

.qr-blended {
  position: absolute;
  top: 40%;
  left: 60%;
  width: 100px; /* adjust size */
  opacity: 0.02;
  z-index: 1; /* behind noise */
  animation: qrFlicker 0.3s infinite alternate;
}

@keyframes qrFlicker {
  0% { opacity: 0.01; }
  50% { opacity: 0.03; }
  100% { opacity: 0.01; }
}
</style>

<script>
function startAudio() {
  const audio1 = new Audio('audio1.mp3');
  audio1.loop = true;
  audio1.volume = 0.3;
  audio1.play();

  const audio2 = new Audio('audio2.mp3');
  audio2.volume = 0.3;

  function loopWithDelay() {
    audio2.play();
    audio2.onended = () => {
      setTimeout(loopWithDelay, 10000); // 10 second delay
    };
  }

  loopWithDelay();
}

window.onload = startAudio;
</script>
</head>

<body>

  OBSERVED VISION SIGNAL FRACTURE TRACE SHADOW OBSERVED VISION
