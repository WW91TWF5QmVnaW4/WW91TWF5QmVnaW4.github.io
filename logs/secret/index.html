<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LOGS SECRET</title>
<style>
body {
  margin: 0;
  background: black;
  color: #0a0;
  font-family: monospace;
  text-align: center;
  padding-top: 15vh;
  overflow: hidden;
}

h1 {
  font-size: 2em;
  animation: flicker 0.15s infinite;
}

@keyframes flicker {
  0%, 49%, 100% { opacity: 1; }
  25%, 75% { opacity: 0.5; }
}

/* Hidden texts */
.hidden {
  opacity: 0.02;
  position: absolute;
  font-size: 0.9em;
}

.subtle {
  opacity: 0.03;
  position: absolute;
  font-size: 0.9em;
}

/* Background noise */
.bg-noise {
  position: fixed;
  top: 0;
  left: 0;
  font-size: 6px;
  opacity: 0.02;
  pointer-events: none;
  width: 100%;
  height: 100%;
  line-height: 6px;
  z-index: 2;
}

/* QR Code blended into noise */
.qr-blended {
  position: absolute;
  top: 40%;
  left: 60%;
  width: 100px;
  opacity: 0.02;
  z-index: 1; /* behind noise */
  animation: qrFlicker 0.3s infinite alternate;
}

@keyframes qrFlicker {
  0% { opacity: 0.01; }
  50% { opacity: 0.03; }
  100% { opacity: 0.01; }
}

/* Start button styling */
#startButton {
  margin-top: 20px;
  padding: 12px 24px;
  font-size: 1em;
  cursor: pointer;
  background: black;
  color: #0a0;
  border: 1px solid #0a0;
  transition: 0.3s;
}

#startButton:hover {
  background: #0a0;
  color: black;
}
</style>

<script>
// Background audio function
function startAudio() {
  // Audio 1: continuous loop
  const audio1 = new Audio('audio1.mp3');
  audio1.loop = true;
  audio1.volume = 0.3;
  audio1.play();

  // Audio 2: loop with 10-second delay
  const audio2 = new Audio('audio2.mp3');
  audio2.volume = 0.3;

  function loopWithDelay() {
    audio2.play();
    audio2.onended = () => {
      setTimeout(loopWithDelay, 10000); // 10 second delay
    };
  }

  loopWithDelay();
}

// Function to reveal page content and start audio
function activateArchive() {
  document.getElementById('startButton').style.display = 'none';
  document.getElementById('logsContent').style.display = 'block';
  startAudio();
}
</script>
</head>

<body>

<h1>SECRET ARCHIVE</h1>
<p>The signal fractures here...</p>

<!-- Start button to allow audio autoplay -->
<button id="startButton" onclick="activateArchive()">Click to Activate Archive</button>

<!-- Hidden content -->
<div id="logsContent" style="display:none">

  <!-- Hidden clues -->
  <p class="hidden">VSZION MOVES SILENTLY</p>
  <p class="hidden" style="bottom:50px; left:30%;">LOOK FOR THE MASK</p>
  <p class="hidden" style="top:20%; left:10%;">.esac eht peek ot uoy era</p> <!-- Reversed: "are you to peek the case." -->

  <!-- THE MASK IS HERE -->
  <!-- TRACE THE LIGHT SHADOWS -->
  <!-- 546865206b65792069732068657265 --> <!-- Hex: "The key is here" -->

  <!-- Background noise -->
  <div class="bg-noise">
    OBSERVED VISION SIGNAL FRACTURE TRACE SHADOW OBSERVED VISION
    OBSERVED VISION SIGNAL FRACTURE TRACE SHADOW OBSERVED VISION
  </div>

  <!-- QR code blended into background noise -->
  <img src="qrcode.png" class="qr-blended" alt="Hidden QR Code">

</div>

</body>
</html>
