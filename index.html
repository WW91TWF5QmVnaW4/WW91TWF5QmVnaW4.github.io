}


.glitch {
  font-size: 2em;
  animation: flicker 0.1s infinite;
}

@keyframes flicker {
  0%, 49%, 100% { opacity: 1; }
  25%, 75% { opacity: 0.6; }
}

/* Hidden texts */
.hidden {
  opacity: 0.01;
  position: absolute;
  left: 5px;
  bottom: 5px;
}

/* Slightly more visible hidden clue */
.subtle {
  opacity: 0.05;
  position: absolute;
  right: 10px;
  top: 10px;
  font-size: 0.9em;
}


.background-glitch {
  position: fixed;
  top: 0;
  left: 0;
  font-size: 8px;
  opacity: 0.02;
  pointer-events: none;
  width: 100%;
  height: 100%;
}
</style>
</head>
